<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furry4Ever | Product</title>
<meta id="meta-description" name="description" content="Furry4Ever product">
<link rel="canonical" href="https://furry4ever.github.io/shop/product.html">
<script src="/language.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fbf9f5;color:#135c59}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.back{color:#135c59;text-decoration:none;font-weight:700}
.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.product-image{display:block;width:100%;max-height:520px;object-fit:contain;border-radius:18px;background:#fafafa}
.category{display:inline-block;margin-top:22px;padding:6px 10px;border-radius:999px;background:#eaf3f2;font-size:12px;font-weight:700}
h1{font-size:30px;margin:14px 0 10px}
p{color:#555;line-height:1.8;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
button,a.action{border:0;display:inline-block;padding:13px 20px;border-radius:12px;text-decoration:none;font-weight:700;cursor:pointer;font-size:15px}
.order{background:#135c59;color:#fff}.ask{background:#eaf3f2;color:#135c59}
.status{margin-top:14px;font-weight:700;color:#a05a00}
#language-slot{min-height:1px}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <a class="back" href="/#shop" data-i18n="product.backToShop">Back to Shop</a>
    <div id="language-slot"></div>
  </div>

  <div class="card" id="product-card">
    <div id="product-loading" data-i18n="product.loading">Loading product...</div>
  </div>
</main>

<script>
(function(){
  const WHATSAPP = "201124333193";
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  function lang(){
    return window.Furry4EverLanguage?.getLanguage?.() || "en";
  }

  function value(data, key){
    const v = data?.[key];
    if (v && typeof v === "object") return v[lang()] || v.en || v.ar || "";
    return String(v ?? "");
  }

  function tr(key, fallback){
    return window.Furry4EverLanguage?.translate?.(key) || fallback;
  }

  function wa(text){
    return "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(text);
  }

  async function loadProduct(){
    const card = document.getElementById("product-card");

    if(!slug){
      card.innerHTML = `<p>${tr("product.notFound","Product not found")}</p>`;
      return;
    }

    try{
      const res = await fetch(
        `/shop/products/${encodeURIComponent(slug)}/product.json`,
        {cache:"no-cache"}
      );
      if(!res.ok) throw new Error("not found");

      const product = await res.json();
      const name = value(product,"name");
      const description = value(product,"description");
      const category = value(product,"category");
      const image = product.image || "image.jpg";
      const available = product.available !== false;

      document.title = `${name} | Furry4Ever`;
      document.getElementById("meta-description").setAttribute("content", description);

      const orderText = lang() === "ar"
        ? `أريد طلب: ${name}\nالكمية: 1`
        : `I want to order: ${name}\nQuantity: 1`;

      const inquiryText = lang() === "ar"
        ? `استفسار عن: ${name}`
        : `Inquiry about: ${name}`;

      card.innerHTML = `
        <img class="product-image"
             src="/shop/products/${encodeURIComponent(slug)}/${encodeURIComponent(image)}"
             alt="${name.replace(/"/g,"&quot;")}">
        <span class="category">${category}</span>
        <h1>${name}</h1>
        <p>${description}</p>
        ${available ? "" : `<div class="status">${tr("shop.unavailable","Currently unavailable")}</div>`}
        <div class="actions">
          ${available ? `<a class="action order" href="${wa(orderText)}" target="_blank" rel="noopener">${tr("product.order","Order via WhatsApp")}</a>` : ""}
          <a class="action ask" href="${wa(inquiryText)}" target="_blank" rel="noopener">${tr("button.inquiry","Inquiry")}</a>
        </div>
      `;
    }catch(e){
      console.error(e);
      card.innerHTML = `<p>${tr("product.loadError","Unable to load product")}</p>`;
    }
  }

  window.addEventListener("furry4ever-language-changed", loadProduct);
  loadProduct();
})();
</script>
</body>
</html>
